name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  framework:
    name: 框架质量门禁（PHP 8.3）
    runs-on: ubuntu-latest

    # 所有命令都在 packages/framework 下执行 ——
    # 本仓库是 monorepo，根目录没有 composer.json
    defaults:
      run:
        working-directory: packages/framework

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, pdo, sqlite3
          coverage: none

      - name: 缓存 Composer
        uses: actions/cache@v4
        with:
          path: packages/framework/vendor
          key: ${{ runner.os }}-php83-${{ hashFiles('packages/framework/composer.json') }}
          restore-keys: ${{ runner.os }}-php83-

      - name: 安装依赖
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint 代码风格
        run: composer pint -- --test

      - name: PHPStan Level 8
        run: composer phpstan

      - name: PHPUnit
        run: composer test

  # 发布前检查脚本（版本一致性 / 必需文件 / 命名一致性）
  release-check:
    name: 发布前检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json
          coverage: none

      - name: 安装依赖
        working-directory: packages/framework
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装文档站依赖
        working-directory: docs
        run: npm ci || npm install

      - name: 运行发布前检查
        run: bash scripts/pre-release.sh

  # 端到端测试：从零搭一个项目装框架，跑真实 HTTP
  #
  # ## 为什么这个 job 必须有
  #
  # 此前 CI 只跑 Pint / PHPStan / PHPUnit —— 全是**单元级**验证。
  # v1.5.0/v1.6.0 新增 7 项基座能力，e2e 覆盖为 0，
  # 而 CI 一直是绿的（见《初衷对照评估》偏离 2）。
  #
  # 单测环境没有容器、没有数据库、没有 HTTP ——
  # 只读资源的 403、上传落盘、鉴权链路全都在它盲区里。
  #
  # 这个 job 顺便验证了一件更重要的事：
  # **一个新项目装完框架能不能真的跑起来。**
  e2e:
    name: 端到端（真实 HTTP）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, pdo_sqlite, sqlite3, curl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备 demo 项目
        run: bash scripts/setup-demo.sh

      - name: 运行发布前检查（含三项端到端）
        env:
          DEMO_PATH: ${{ github.workspace }}/../demo-app
        run: bash scripts/pre-release.sh --with-e2e

  # 低版本 PHP 兼容性：确认不会用到 8.3 独占语法
  php82-compat:
    name: PHP 8.2 兼容性
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/framework

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json, pdo, sqlite3
          coverage: none

      - name: 安装依赖
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPUnit
        run: composer test
