name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  framework:
    name: 框架质量门禁（PHP 8.3）
    runs-on: ubuntu-latest

    # 所有命令都在 packages/laravel 下执行 ——
    # （拆包后驱动包才有 vendor 与测试；framework 是元包）
    # 本仓库是 monorepo，根目录没有 composer.json
    defaults:
      run:
        working-directory: packages/laravel

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, pdo, sqlite3
          coverage: none

      - name: 缓存 Composer
        uses: actions/cache@v4
        with:
          path: packages/laravel/vendor
          key: ${{ runner.os }}-php83-${{ hashFiles('packages/laravel/composer.json') }}
          restore-keys: ${{ runner.os }}-php83-

      - name: 安装依赖
        run: composer install --no-interaction --prefer-dist --no-progress

      #
      # core 纯度门禁：`packages/core` 不得依赖 illuminate / laravel。
      #
      # 这条门禁把「core 是框架无关的」从**声明**变成**事实**。
      # 没有它，core 里会悄悄长回 Illuminate 依赖（AI 照抄别处 import 时尤其容易），
      # 后果是 ThinkPHP 用户重新掉进「装上就炸」的全局 env() 冲突。
      #
      # 注意本 job 的 working-directory 是 packages/laravel，
      # 走仓库根的脚本要显式覆盖。
      - name: core 纯度门禁
        working-directory: .
        run: bash scripts/check-core-purity.sh

      - name: Pint 代码风格
        run: composer pint -- --test

      - name: PHPStan Level 8
        run: composer phpstan

      - name: PHPUnit
        run: composer test

  #
  # 内核 aimanong/core 的质量门禁。
  #
  # ⚠️ 为什么单独开一个 job：core 是**两个驱动共用的那一半**
  # （99 个类 / 10843 行），但此前 **0 单测 / 0 PHPStan / 0 Pint**。
  #
  # 两个驱动的 PHPStan 都把 `../core/src` 加进了 paths，所以它间接过了
  # 静态分析 —— 但用的是**各自的配置与忽略规则**，core 自己的问题
  # 可能被别人的 ignore 盖住；单测则完全没有。
  #
  # core 是**框架无关**的（`check-core-purity.sh` 保证不依赖 illuminate），
  # 所以它能独立测试：不需要容器、不需要数据库。
  #
  core:
    name: 内核 core 门禁
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/core

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json
          coverage: none

      - name: 安装依赖
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint 代码风格
        run: composer pint -- --test

      - name: PHPStan Level 8
        run: composer phpstan

      - name: PHPUnit
        run: composer test

  #
  # 官方扩展 aimanong/region 的质量门禁。
  #
  # ⚠️ 为什么单独开一个 job：这个包此前 **0 单测 / 0 phpstan / 0 CI**，
  # 却已经发布到 Packagist（v1.0.1）。已发布的包没有门禁，等于
  # 「改坏了也没人知道」—— 它是别人 composer require 装进生产的东西。
  #
  # 顺带把一条文档事故钉成断言：README 标题曾写「内置数据只有 3 个省」、
  # 正文写「只有 5 个省」（framework/README 又抄了错的 3）。
  # 现在 5 省 / 37 节点写死在 RegionDataTest 里，改数据不改文档会红。
  #
  region:
    name: 官方扩展 region 门禁
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/region

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, pdo, sqlite3
          coverage: none

      #
      # region 的 path 仓库同时指向 ../core / ../laravel / ../framework，
      # 三者都在本仓库里，无需网络。
      #
      - name: 安装依赖
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint 代码风格
        run: composer pint -- --test

      - name: PHPStan Level 8
        run: composer phpstan

      - name: PHPUnit
        run: composer test

  # 发布前检查脚本（版本一致性 / 必需文件 / 命名一致性）
  release-check:
    name: 发布前检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json
          coverage: none

      - name: 安装依赖
        working-directory: packages/laravel
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装文档站依赖
        working-directory: docs
        run: npm ci || npm install

      - name: 运行发布前检查
        run: bash scripts/pre-release.sh

  # 端到端测试：从零搭一个项目装框架，跑真实 HTTP
  #
  # ## 为什么这个 job 必须有
  #
  # 此前 CI 只跑 Pint / PHPStan / PHPUnit —— 全是**单元级**验证。
  # v1.5.0/v1.6.0 新增 7 项基座能力，e2e 覆盖为 0，
  # 而 CI 一直是绿的（见《初衷对照评估》偏离 2）。
  #
  # 单测环境没有容器、没有数据库、没有 HTTP ——
  # 只读资源的 403、上传落盘、鉴权链路全都在它盲区里。
  #
  # 这个 job 顺便验证了一件更重要的事：
  # **一个新项目装完框架能不能真的跑起来。**
  e2e:
    name: 端到端（真实 HTTP）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, pdo_sqlite, sqlite3, curl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      #
      # 三套依赖都要装 —— 缺一套就会有一批检查失败：
      #   framework   → PHPUnit / PHPStan / Pint / 版本号一致性
      #   docs        → 文档站构建
      #   demo        → 端到端
      #
      # 回归：e2e job 第一版漏了 framework 的 composer install，
      # 结果 PHPUnit / PHPStan / Pint **全部报错**，
      # 而报错信息（「PHPUnit 失败」）完全指不到「依赖没装」。
      #
      - name: 安装框架依赖
        working-directory: packages/laravel
        run: composer install --no-interaction --prefer-dist --no-progress

      #
      # ThinkPHP 包自己的依赖 —— 它需要 topthink/framework 才能做静态分析
      # （分析器要能解析 think\* 这些类）。
      #
      # ⚠️ 这一步是全面验收时才补的：此前 packages/thinkphp 完全没有
      # PHPStan / Pint，3451 行代码没有过一次静态分析。
      #
      - name: 安装 ThinkPHP 驱动依赖
        working-directory: packages/thinkphp
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: 安装文档站依赖
        working-directory: docs
        run: npm ci || npm install

      - name: 准备 demo 项目
        run: bash scripts/setup-demo.sh

      #
      # ThinkPHP 演示项目 —— 与 demo-app 并列。
      #
      # 为什么必须有：ThinkPHP 侧的模板转换器出的问题**不报错**。
      # 退出码 0、模板 4 条规则全过、think-template 也能编译，
      # 产物只是渲染得不对（实测踩过 {volist} 字符串键 % 2、
      # @switch 只标注不转换、转换器正则错误）。单测 / PHPStan /
      # 代码风格 / 模板规则全都拦不住 —— 唯一的裁判是真跑一遍页面。
      #
      # 这个步骤顺便断言 vendor/illuminate **不存在**：
      # PoC 阶段实测过，illuminate/support 会抢注全局 env()，
      # 导致 ThinkPHP 启动即致命。拆包就是为了消灭这个冲突。
      #
      - name: 准备 ThinkPHP 演示项目
        run: bash scripts/setup-thinkphp-demo.sh

      #
      # 启动 demo 服务。
      #
      # ⚠️ 必须真的起服务 —— `pre-release.sh --with-e2e` 要跑
      # http-e2e（真实 HTTP 行为），而它需要 localhost:8899 上有服务。
      # 只建项目不起服务，http-e2e 会被判定为失败。
      #
      - name: 启动 demo 服务
        run: |
          cd "${{ github.workspace }}/../demo-app"
          nohup php artisan serve --port=8899 > /tmp/serve.log 2>&1 &
          # 等服务就绪（最多 30 秒）
          for i in $(seq 1 30); do
            if curl -s -o /dev/null "http://localhost:8899/admin/auth/login"; then
              echo "✓ demo 服务已就绪（${i}s）"
              exit 0
            fi
            sleep 1
          done
          echo "❌ demo 服务启动超时"
          cat /tmp/serve.log
          exit 1

      - name: 运行发布前检查（含三项端到端）
        env:
          DEMO_PATH: ${{ github.workspace }}/../demo-app
        run: bash scripts/pre-release.sh --with-e2e

  # 低版本 PHP 兼容性：确认不会用到 8.3 独占语法
  php82-compat:
    name: PHP 8.2 兼容性
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/laravel

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json, pdo, sqlite3
          coverage: none

      - name: 安装依赖
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPUnit
        run: composer test
