name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  framework:
    name: 框架质量门禁（PHP 8.3）
    runs-on: ubuntu-latest

    # 所有命令都在 packages/framework 下执行 ——
    # 本仓库是 monorepo，根目录没有 composer.json
    defaults:
      run:
        working-directory: packages/framework

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, pdo, sqlite3
          coverage: none

      - name: 缓存 Composer
        uses: actions/cache@v4
        with:
          path: packages/framework/vendor
          key: ${{ runner.os }}-php83-${{ hashFiles('packages/framework/composer.json') }}
          restore-keys: ${{ runner.os }}-php83-

      - name: 安装依赖
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint 代码风格
        run: composer pint -- --test

      - name: PHPStan Level 8
        run: composer phpstan

      - name: PHPUnit
        run: composer test

  # 发布前检查脚本（版本一致性 / 必需文件 / 命名一致性）
  release-check:
    name: 发布前检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json
          coverage: none

      - name: 安装依赖
        working-directory: packages/framework
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装文档站依赖
        working-directory: docs
        run: npm ci || npm install

      - name: 运行发布前检查
        run: bash scripts/pre-release.sh

  # 低版本 PHP 兼容性：确认不会用到 8.3 独占语法
  php82-compat:
    name: PHP 8.2 兼容性
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/framework

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json, pdo, sqlite3
          coverage: none

      - name: 安装依赖
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPUnit
        run: composer test
