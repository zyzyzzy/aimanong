name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  php-quality:
    name: PHP 质量门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, pdo, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint 代码风格
        run: composer pint -- --test

      - name: PHPStan Level 8
        run: composer phpstan

      - name: PHPUnit / Pest
        run: composer test

  frontend-quality:
    name: 前端质量门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: TypeScript 类型检查
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm run test

  # 本项目特色：Schema 产物快照比对，任何漂移即失败
  schema-drift:
    name: Schema 产物漂移检测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: 检测 Schema 产物漂移
        run: composer schema:verify
        # 该命令比对：JSON Schema / TypeScript 类型 / OpenAPI / AI 提示词
        # 四份产物是否与声明一致。漂移 = 文档与实现不一致 = AI 出错的根源
